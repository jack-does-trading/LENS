# Render Blueprint (https://render.com/docs/blueprint-spec) for the Lens
# FastAPI backend. The frontend (Next.js) is deployed separately on Vercel
# -- Render only hosts this one service.
#
# First-time setup: push this repo to GitHub, then in the Render dashboard
# choose "New +" -> "Blueprint" and point it at the repo. Render reads this
# file and creates the service below; you still need to fill in the secret
# env vars marked `sync: false` yourself (Render won't invent them).
services:
  - type: web
    name: lens-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # --- Secrets: set these in the Render dashboard, not here ------------
      - key: DATABASE_URL
        sync: false # Supabase connection string, see deployment notes
      - key: VOYAGE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: INGESTION_API_KEY
        sync: false # any long random string you generate yourself
      # --- Non-secret config -------------------------------------------
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        # Groq decommissioned llama-3.3-70b-versatile (and llama-3.1-8b-instant)
        # on 2026-08-16; openai/gpt-oss-120b is Groq's recommended same-class
        # replacement. NOTE: this blueprint value only reaches a service that
        # was created from this blueprint or re-synced -- if lens-backend
        # predates/bypassed it, update GROQ_MODEL by hand in the Render
        # dashboard's Environment tab too, or this line does nothing.
        value: openai/gpt-oss-120b
      - key: VOYAGE_MODEL
        value: voyage-3
      - key: EMBEDDING_DIMENSION
        value: "1024"
      # One JSON object per log line, so the pipeline's quality events
      # (analysis.fallback_used, analysis.verification_failed) can be filtered
      # and counted in Render's log search instead of eyeballed. Off by default
      # in app/main.py -- plain text reads better locally and under pytest.
      - key: LENS_JSON_LOGS
        value: "1"
      # --- Langfuse tracing (app/tracing.py) -- OFF unless you set a key ---
      # Deliberately left at false. Turning this on ships prompts -- which
      # contain users' journal entries -- to a third party, and that is a
      # decision to make on purpose rather than inherit from a blueprint. See
      # docs/Architecture.md section 10, deviation 5.
      #
      # Tracing fails OPEN: a Langfuse outage logs a warning and the analysis
      # still succeeds. It is the one component in this app that does not fail
      # closed, because a diagnostic must never cost a user their answer.
      - key: LANGFUSE_ENABLED
        value: "false"
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
      # Masking ON. Structure, ids, scores, latencies and character counts are
      # still exported; every piece of user text becomes a stable digest. You
      # keep every operational metric and lose only the ability to read a prompt
      # in the Langfuse UI. Set to "false" ONLY if you have decided, explicitly,
      # that shipping journal text to Langfuse is acceptable for this deployment.
      - key: LANGFUSE_MASK_INPUTS
        value: "true"
      - key: LANGFUSE_ENVIRONMENT
        value: production
      # Update once the Vercel frontend URL is known (see deployment notes) --
      # a placeholder here would silently block every request with a CORS
      # error, so this is deliberately left for you to fill in rather than
      # guessed.
      - key: CORS_ALLOW_ORIGINS
        sync: false
