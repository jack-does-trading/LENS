[pytest]
testpaths = tests
pythonpath = .
markers =
    eval: golden-set evaluation; needs recorded cassettes, no network
    eval_live: hits real provider APIs; needs GROQ_API_KEY/VOYAGE_API_KEY
# Expensive and network-dependent evals stay out of the default run so `pytest`
# means the same thing locally and in CI. Run them explicitly with -m eval or
# -m eval_live. --strict-markers turns a typo'd marker into an error rather
# than a silently-skipped test.
addopts = -m "not eval and not eval_live" --strict-markers
